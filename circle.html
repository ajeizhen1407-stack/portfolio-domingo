<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Circle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="/" class="nav-brand">CpE <span>Portfolio</span></a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works" class="active">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </header>

    <main class="container">
        <div class="card">
            <div class="card-header">
                <h1>Area of a Circle</h1>
                <p>Formula: <strong>Area = &pi; &times; radius &sup2;</strong></p>
            </div>

            <form action="/works/area/circle" method="post" style="max-width: 450px;">
                <div class="form-group">
                    <label for="radius">Radius:</label>
                    <input type="number" step="any" id="radius" name="radius" placeholder="Enter radius" required>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">Compute</button>
                    <a href="/works" class="btn btn-secondary">Back to Works</a>
                </div>
            </form>

            <div class="alert">
                <strong>Area:</strong> 
            </div>
        </div>
    </main>
</body>
</html>
