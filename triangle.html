<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Triangle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="/" class="nav-brand">CpE <span>Portfolio</span></a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works" class="active">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </header>

    <main class="container">
        <div class="card">
            <div class="card-header">
                <h1>Area of a Triangle</h1>
                <p>Formula: <strong>Area = &frac12; &times; base &times; height</strong></p>
            </div>

            <form action="/works/area/triangle" method="post" style="max-width: 450px;">
                <div class="form-group">
                    <label for="base">Base:</label>
                    <input type="number" step="any" id="base" name="base" placeholder="Enter base" required>
                </div>
                <div class="form-group">
                    <label for="height">Height:</label>
                    <input type="number" step="any" id="height" name="height" placeholder="Enter height" required>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary">Compute</button>
                    <a href="/works" class="btn btn-secondary">Back to Works</a>
                </div>
            </form>

            {% if result is not none %}
            <div class="alert">
                <strong>Area:</strong> {{ result }} sq. units
            </div>
            {% endif %}
        </div>
    </main>
</body>
</html>
